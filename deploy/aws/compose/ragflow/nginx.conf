server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Increase upload size limit (default is 1MB)
    # Adjust this based on your document size requirements
    client_max_body_size 100M;

    # Serve static frontend files
    root /ragflow/web/dist;
    index index.html;

    # API proxy
    location /v1/ {
        proxy_pass http://127.0.0.1:9380/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase upload size for API endpoints as well
        client_max_body_size 100M;
    }

    # SDK / HTTP API proxy (Bearer-token routes: /api/v1/agents, /api/v1/datasets,
    # /api/v1/tenants, /api/v1/agents_openai, ...). Without this block these fall
    # through to the SPA below and return 200 + index.html instead of JSON, which
    # looks like success to any client. No trailing path on proxy_pass so the full
    # /api/... URI is preserved.
    location /api/ {
        proxy_pass http://127.0.0.1:9380;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 100M;
    }

    # Serve frontend for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}

