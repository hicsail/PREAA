services:
  langflow:
    image: langflowai/langflow:1.9.2
    restart: unless-stopped
    container_name: portainer-LangFlow
    ports:
      - "7860:7860"
    depends_on:
      - postgres
    volumes:
      - portainer-langflow-data:/app/langflow
      - portainer-langflow-components:/app/custom_components/
    environment:
      - LANGFLOW_DATABASE_URL=${LANGFLOW_DATABASE_URL}
      - LANGFLOW_CONFIG_DIR=${LANGFLOW_CONFIG_DIR}
      - LANGFLOW_COMPONENTS_PATH=${LANGFLOW_COMPONENTS_PATH}
      - LANGFLOW_LOG_LEVEL=${LANGFLOW_LOG_LEVEL}
      - LANGFLOW_PROMETHEUS_ENABLE=${LANGFLOW_PROMETHEUS_ENABLE}
      - LANGFLOW_AUTO_LOGIN=${LANGFLOW_AUTO_LOGIN}
      - LANGFLOW_SUPERUSER=${LANGFLOW_SUPERUSER}
      - LANGFLOW_SUPERUSER_PASSWORD=${LANGFLOW_SUPERUSER_PASSWORD}
      - LANGFLOW_SECRET_KEY=${LANGFLOW_SECRET_KEY}
      - LANGFLOW_NEW_USER_IS_ACTIVE=${LANGFLOW_NEW_USER_IS_ACTIVE}

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    container_name: portainer-PostgreSQL
    volumes:
      - portainer-postgres-data:/var/lib/postgresql/data
    env_file:
      - ../../stack.env
      - stack.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "--host=localhost", "--username psql"]
      interval: 3s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:litellm_stable_release_branch-v1.68.0-stable
    restart: unless-stopped
    container_name: portainer-litellm
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=${LITELLM_DATABASE_URL}
    env_file:
      - ../../stack.env
      - stack.env
    depends_on:
      - postgres
    volumes:
      - portainer-litellm:/app/config
    command: "--config /app/config/litellm.yaml"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    container_name: portainer-langfuse-worker
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "3030:3030"
    environment:
      - DATABASE_URL=${LANGFUSE_DATABASE_URL}
    env_file:
      - ../../stack.env
      - stack.env

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: portainer-langfuse-web
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${LANGFUSE_DATABASE_URL}
    env_file:
      - ../../stack.env
      - stack.env

  clickhouse:
    image: clickhouse/clickhouse-server
    container_name: portainer-clickhouse
    restart: unless-stopped
    user: "101:101"
    env_file:
      - ../../stack.env
      - stack.env
    volumes:
      - portainer-langfuse-clickhouse-data:/var/lib/clickhouse
      - portainer-langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    image: minio/minio
    restart: unless-stopped
    container_name: portainer-minio
    entrypoint: sh
    # create the 'langfuse' bucket before starting the service
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    env_file:
      - ../../stack.env
      - stack.env
    volumes:
      - portainer-langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  redis:
    image: redis:7
    restart: unless-stopped
    container_name: portainer-redis
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    env_file:
      - ../../stack.env
      - stack.env

  chat-client:
    image: hicsail/preaa-chat-client:prod
    pull_policy: always
    container_name: portainer-chat-client
    restart: unless-stopped
    ports:
      - "3009:80"
    env_file:
      - ../../stack.env
      - stack.env

  admin:
    image: hicsail/preaa-admin:main
    pull_policy: always
    container_name: portainer-admin
    restart: unless-stopped
    ports:
      - "3016:3000"
    depends_on:
      - postgres
    environment:
      # Admin-specific overrides so it doesn't inherit langfuse's DATABASE_URL /
      # ENCRYPTION_KEY from the shared stack.env. The app self-provisions the
      # `admin` database + tables on boot.
      - DATABASE_URL=${ADMIN_DATABASE_URL}
      - ENCRYPTION_KEY=${ADMIN_ENCRYPTION_KEY}
    env_file:
      - ../../stack.env
      - stack.env

  embedded-chat:
    image: hicsail/preaa-embedded-chat:prod
    pull_policy: always
    container_name: portainer-embedded-chat
    restart: unless-stopped
    ports:
      - "3017:80"

volumes:
  portainer-langflow-data:
  portainer-langflow-components:
  portainer-postgres-data:
  portainer-litellm:
  portainer-langfuse-clickhouse-data:
  portainer-langfuse-clickhouse-logs:
  portainer-langfuse-minio-data:
